name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt onvif-zeep

      - name: End-to-end test against mock VTO
        working-directory: test
        run: |
          python mock_dahua.py > mock.log 2>&1 &
          sleep 1
          python ../dahua_onvif.py test_config.yaml > bridge.log 2>&1 &
          sleep 3
          timeout 90 python test_client.py

      - name: Show logs on failure
        if: failure()
        working-directory: test
        run: |
          echo "--- mock"; cat mock.log || true
          echo "--- bridge"; cat bridge.log || true

  podman:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements.txt onvif-zeep

      - name: Validate Quadlet units and installer
        run: |
          QUADLET_UNIT_DIRS=$PWD/podman /usr/libexec/podman/quadlet -dryrun
          QUADLET_UNIT_DIRS=$PWD/podman /usr/libexec/podman/quadlet -dryrun -user
          shellcheck -S warning podman/install.sh

      - name: Build image with podman (rootful, like a system Quadlet)
        run: sudo podman build -t localhost/dahua-onvif:ci .

      - name: Install with podman/install.sh under systemd (as on a real host)
        run: |
          nohup python test/mock_dahua.py > mock.log 2>&1 &
          sleep 1
          sudo ./podman/install.sh --vto 127.0.0.1 --vto-port 8080 \
            --password 'p@ss w' --image localhost/dahua-onvif:ci

      - name: Check the services
        run: |
          systemctl is-active dahua-onvif go2rtc
          systemctl cat dahua-onvif | grep -- '--user 0'
          systemctl cat dahua-onvif | grep -- '--cap-add=net_bind_service'
          sleep 3
          curl -sf http://127.0.0.1/ | tee index.html | grep -q "ONVIF device service"
          grep -q "stream.html?src=voordeur" index.html
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:1984/api/streams > streams.json && break; sleep 1; done
          cat streams.json
          grep -q '"voordeur"' streams.json
          grep -q '"voordeur_sub"' streams.json
          # password 'p@ss w' must not break the RTSP URL (host must parse as 127.0.0.1)
          grep -q '@127.0.0.1:554/cam' streams.json
          ! grep -q 'ss w@' streams.json
          sudo podman exec go2rtc printenv DAHUA_PASSWORD | grep -qx '%70%40%73%73%20%77'
          curl -sf "http://127.0.0.1:1984/stream.html?src=voordeur&mode=webrtc,mse" | grep -qi "video-stream"
          cd test && ONVIF_PORT=80 timeout 90 python test_client.py

      - name: Re-run installer keeps config and restarts cleanly
        run: |
          sudo ./podman/install.sh --image localhost/dahua-onvif:ci < /dev/null | tee reinstall.log
          grep -q "keeping existing /etc/dahua-onvif/config.yaml" reinstall.log
          sudo podman exec dahua-onvif printenv DAHUA_PASSWORD | grep -qx 'p@ss w'
          systemctl is-active dahua-onvif go2rtc

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- mock"; cat mock.log || true
          echo "--- config"; sudo cat /etc/dahua-onvif/config.yaml /etc/dahua-onvif/go2rtc.yaml || true
          sudo journalctl -u dahua-onvif -u go2rtc --no-pager -n 200 || true

  build:
    needs: [test, podman]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
