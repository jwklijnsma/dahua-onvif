# dahua-onvif config for a Dahua VTO2111D-P

dahua:
  host: 192.168.1.50        # VTO IP address
  port: 80                  # HTTP API (same as the Home Assistant integration)
  rtsp_port: 554
  username: admin
  password: ""              # or set DAHUA_PASSWORD in the environment
  channel: 1
  events: true              # keep the event stream open (motion + doorbell button)

onvif:
  port: 80                  # ONVIF/web port on this host (<1024 needs NET_BIND_SERVICE, set in the Quadlet unit)
  name: Voordeur            # name shown in the NVR
  advertise_ip:             # leave empty to auto-detect the IP facing the VTO
  username: ""              # set to require ONVIF login from the NVR (recommended)
  password: ""              # or set ONVIF_PASSWORD
  discovery: true           # WS-Discovery on udp/3702
  # uuid / mac are derived from the VTO serial; override only if needed

stream:
  embed_credentials: true   # put VTO login in the RTSP URL handed to the NVR
  # Optional: point the NVR at the go2rtc restream instead of the VTO itself
  # (the VTO only allows a few RTSP clients; go2rtc keeps one connection open)
  # main_url: rtsp://<podman-host-ip>:8554/voordeur
  # sub_url:  rtsp://<podman-host-ip>:8554/voordeur_sub

live:
  # Live video on the status page via go2rtc (see podman/go2rtc.container).
  # "auto" = go2rtc on the same host as this page, port 1984. Or a full URL: http://10.0.2.10:1984
  go2rtc_url: auto
  stream: voordeur          # stream name in go2rtc.yaml
  mode: webrtc,mse          # webrtc = lowest latency, mse = fallback

doorbell:
  hold_seconds: 3           # how long the doorbell input stays "true" after a press
  extra_codes: []           # extra Dahua event codes to treat as a ring

log_level: INFO             # DEBUG prints every Dahua event code - handy for tuning
